[project options]
enable-tflite-backbone=false
enable-nnstreamer-backbone=false
enable-tflite-interpreter=false
install-app=false
enable-opencl = true
enable-cuda = true
enable-fp16 = true
# Port scope = library + app compile fp16-ON on MSVC. The unit-test suite has
# pre-existing, port-unrelated breakage on this branch (unittest_opencl_kernels_int4
# references non-existent openvino_*_cl symbols) plus test-only portability gaps
# (setenv, Half++); those are out of scope here. CPU test CI (windows-native.ini)
# still runs meson test.
enable-test = false

[built-in options]
werror=false
c_std='c17'
cpp_std='c++20'
platform='windows'
vsenv = true
default_library = 'static'
