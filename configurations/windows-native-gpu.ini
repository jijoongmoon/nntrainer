[project options]
enable-tflite-backbone=false
enable-nnstreamer-backbone=false
enable-tflite-interpreter=false
install-app=false
enable-opencl = true
enable-cuda = true
enable-fp16 = true
# Port scope = library + app compile fp16-ON on MSVC. The unit-test suite has
# pre-existing, port-unrelated breakage on this branch (unittest_opencl_kernels_int4
# references non-existent openvino_*_cl symbols) plus test-only portability gaps
# (setenv, Half++); those are out of scope here. CPU test CI (windows-native.ini)
# still runs meson test.
enable-test = false
# OpenBLAS off on Windows: no GEMM/GEMV consumer on any shipped profile (XMX/
# cuda run GPU GEMM + KAI/GGML on CPU; level-1 ops route to the fallbacks),
# while its per-instance 128MB buffer pool cost 8.4GB of private commit under
# static linking (17 embedded copies x 5 slabs).
enable-blas = false

[built-in options]
werror=false
c_std='c17'
cpp_std='c++20'
platform='windows'
vsenv = true
# default_library: SHARED is the intended default flavor (single nntrainer.dll
# — faster prefill, far smaller private commit; validated on intel/XMX + cuda-a2
# both flavors). Meson's own default is already 'shared', so we deliberately do
# NOT pin it here: a machine-file pin silently overrode a command-line
# `meson configure -Ddefault_library=<x>` on every ninja regen (measured), which
# would break the static opt-in. The static flavor is opt-in per build dir via a
# saved `-Ddefault_library=static` (builddir), which `meson setup --wipe` reuses.
